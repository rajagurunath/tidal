[project]
name = "tidal-serve"
version = "0.1.0"
description = "Batch + online co-serving for vLLM: an OpenAI-compatible Batch API with a 24h SLA, priced for idle GPU capacity"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Gurunath Lunkupali Venugopal" }]
keywords = ["vllm", "llm-serving", "batch-api", "scheduling", "co-location"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "typer>=0.12",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
engine = []  # TidalScheduler imports vllm from the host environment; no pin here
eval = ["matplotlib>=3.8", "openai>=1.40"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "matplotlib>=3.8",
  "openai>=1.40",
]

[project.scripts]
tidal = "tidal.cli:app"

[project.urls]
Homepage = "https://github.com/rajagurunath/tidal"
Repository = "https://github.com/rajagurunath/tidal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidal"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running vLLM server (deselect with '-m \"not integration\"')",
]
